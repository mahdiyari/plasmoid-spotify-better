name: Release

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          test "v$(jq -r '.KPlugin.Version' src/metadata.json)" = "$GITHUB_REF_NAME"
          make VERSION="$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "plasmoid-spotify-better-$GITHUB_REF_NAME.tar.gz" --verify-tag --generate-notes
